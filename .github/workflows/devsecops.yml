name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep pip-audit

      # 4. Run Gitleaks
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Run Semgrep
      - name: Semgrep SAST Scan
        run: |
          semgrep scan --config=auto --error .

      # 6. Run pip-audit
      - name: Dependency Scan
        run: |
          pip-audit -r requirements.txt

      # 7. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t vulnerable-app .

      # 8. Run Trivy container scan
      - name: Trivy Container Vulnerability Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest \
            image --scanners vuln \
            --format table \
            --output /workspace/trivy-image-report.txt \
            vulnerable-app

      # 9. Upload Trivy Report
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

      # 10. Start application
      - name: Start Application
        run: |
          docker run -d \
            --name vulnerable-app-container \
            -p 5001:5001 \
            vulnerable-app

      # 11. Wait for application
      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:5001/login; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs vulnerable-app-container
          exit 1

      # 12. OWASP ZAP DAST Scan
      - name: OWASP ZAP DAST Scan
        run: |
          mkdir -p .zap/reports
          chmod 777 .zap/reports

          docker run --rm \
            --network=host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd \
            -autorun /zap/wrk/.zap/zap-plan.yaml

      # 13. Upload ZAP Report
      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-dast-report
          path: .zap/reports/zap-report.html

      # 14. Stop application
      - name: Stop Application
        if: always()
        run: |
          docker stop vulnerable-app-container || true
          docker rm vulnerable-app-container || true
