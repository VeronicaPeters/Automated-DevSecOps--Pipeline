name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep pip-audit

      # 4. Run Gitleaks
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Run Semgrep
      - name: Semgrep SAST Scan
        run: |
          semgrep scan --config=auto .

      # 6. Run pip-audit
      - name: Dependency Scan
        run: |
          pip-audit -r requirements.txt

      # 7. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t vulnerable-app .

      # 8. Start application
      - name: Start Application
        run: |
          docker run -d \
            --name vulnerable-app-container \
            -p 5001:5001 \
            vulnerable-app

      # 9. Wait for application
      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:5001/login; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs vulnerable-app-container
          exit 1

      # 10. OWASP ZAP baseline scan
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:5001/login"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"

      # 11. Stop application
      - name: Stop Application
        if: always()
        run: |
          docker stop vulnerable-app-container || true
          docker rm vulnerable-app-container || true
